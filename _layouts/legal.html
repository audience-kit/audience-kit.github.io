---
layout: default
---
<article class="wrap legal">
  <header class="legal__head">
    <p class="caption">Legal</p>
    <h1 class="title">{{ page.title }}</h1>
    <p class="body-sm muted">Last updated {{ site.legal_updated | date: "%-d %B %Y" }}</p>
  </header>
  <div class="card prose">
    {{ content }}
  </div>
  <nav class="legal__nav body-sm" aria-label="Legal">
    <a href="{{ '/privacy/' | relative_url }}">Privacy policy</a>
    <a href="{{ '/terms/' | relative_url }}">Terms of service</a>
    <a href="{{ '/data-deletion/' | relative_url }}">Delete your data</a>
  </nav>
</article>
